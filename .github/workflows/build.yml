name: Build UNIIZI TWEAKER 01

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test tests/UniiziTweaker01.Tests/UniiziTweaker01.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish single-file self-contained exe
        run: >
          dotnet publish src/UniiziTweaker01/UniiziTweaker01.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish

      - name: Verify the exe exists and write checksum
        shell: pwsh
        run: |
          $exe = "publish/UNIIZI_TWEAKER_01.exe"
          if (-not (Test-Path $exe)) { throw "UNIIZI_TWEAKER_01.exe was not produced" }
          Get-Item $exe | Format-List Name, Length
          $hash = Get-FileHash $exe -Algorithm SHA256
          "$($hash.Hash)  UNIIZI_TWEAKER_01.exe" | Out-File -Encoding ascii publish/SHA256.txt
          Get-Content publish/SHA256.txt

      - name: Smoke test (start the app, exit by itself after a few seconds)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $p = Start-Process -FilePath "publish/UNIIZI_TWEAKER_01.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Smoke test: app did not exit in time" }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          "Smoke test passed"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNIIZI_TWEAKER_01-win-x64
          path: |
            publish/UNIIZI_TWEAKER_01.exe
            publish/SHA256.txt
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UNIIZI_TWEAKER_01-win-x64
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UNIIZI_TWEAKER_01.exe
            SHA256.txt
